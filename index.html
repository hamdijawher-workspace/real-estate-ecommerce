<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darna Properties | Premium Tunisian Real Estate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --tesla-black: #171a20;
            --tesla-grey: #393c41;
            --tesla-white: #ffffff;
            --tesla-blue: #3e6ae1;
            --transition: all 0.3s cubic-bezier(0.5, 0, 0, 0.75);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gotham', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            color: var(--tesla-black);
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            z-index: 100;
            transition: var(--transition);
        }

        .nav-logo {
            font-weight: 600;
            letter-spacing: 2px;
            text-decoration: none;
            color: var(--tesla-black);
            font-size: 1.2rem;
        }

        .nav-menu {
            display: flex;
            list-style: none;
        }

        .nav-menu li {
            margin: 0 15px;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--tesla-black);
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .nav-menu a:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        /* Hero Sections */
        .section {
            height: 100vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 120px 20px 80px;
            scroll-snap-align: start;
        }

        .content {
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        .content h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .content p {
            font-size: 0.9rem;
            color: var(--tesla-grey);
        }

        .buttons {
            display: flex;
            gap: 20px;
            animation: slideUp 1s ease-out;
        }

        .btn {
            width: 256px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .btn-dark {
            background-color: rgba(23, 26, 32, 0.8);
            color: white;
        }

        .btn-light {
            background-color: rgba(255, 255, 255, 0.65);
            color: var(--tesla-grey);
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Full page scroll */
        .container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#" class="nav-logo">DARNA PROPERTIES</a>
        <ul class="nav-menu">
            <li><a href="#">Villas</a></li>
            <li><a href="#">Apartments</a></li>
            <li><a href="#">Land</a></li>
            <li><a href="#">Commercial</a></li>
        </ul>
        <div class="nav-actions">
            <a href="#" class="nav-menu">Account</a>
            <a href="#" class="nav-menu">Menu</a>
        </div>
    </nav>

    <div class="container">
        <!-- Section 1 -->
        <section class="section" style="background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80')">
            <div class="content">
                <h1>The New Standard of Living</h1>
                <p>Experience luxury in the heart of Tunisia</p>
            </div>
            <div class="buttons">
                <a href="#" class="btn btn-dark">View Properties</a>
                <a href="#" class="btn btn-light">Contact Sales</a>
            </div>
        </section>

        <!-- Section 2 -->
        <section class="section" style="background-image: url('https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&w=1920&q=80')">
            <div class="content">
                <h1>Coastal Villas</h1>
                <p>Breathtaking views of the Mediterranean</p>
            </div>
            <div class="buttons">
                <a href="#" class="btn btn-dark">Explore Sousse</a>
                <a href="#" class="btn btn-light">Explore Hammamet</a>
            </div>
        </section>
    </div>
</body>
</html>
